schema_version: "1.0"

extension:
  id: "clewseau-gate"
  name: "Clewseau Gate"
  version: "0.1.0"
  description: "Gate 2 — deterministic refusal of silent gaps and untraced scope against a durable-ID registry."
  category: "visibility"
  effect: "read-only"
  author: "Rik Dryfoos / Dryfoos Consulting"
  license: "MIT"
  homepage: "https://github.com/rdryfoos/clewseau"
  repository: "https://github.com/rdryfoos/clewseau"

requires:
  speckit_version: ">=0.14.0"
  tools: []

provides:
  commands:
    - name: "speckit.clewseau-gate.check"
      file: "commands/speckit.clewseau-gate.check.md"
      description: "Run Clewseau Gate 2 traceability check (silent gaps fail)"

  config:
    - name: "clewseau-gate-config.yml"
      template: "config-template.yml"
      description: "Registry path, source/test globs, and ID grammar"
      required: true

hooks:
  after_implement:
    command: "speckit.clewseau-gate.check"
    optional: true
    prompt: "Run Clewseau Gate 2 traceability check?"
    description: "Refuse silent gaps after implementation"

tags:
  - "traceability"
  - "gate"
  - "ci"
  - "governance"
  - "sdd"
