schema_version: "1.0"

extension:
  id: "clewseau-gate"
  name: "Clewseau Gate"
  version: "0.2.0"
  description: "Gate 2 — refuse silent gaps and emit a clew (`clew.json`)."
  category: "visibility"
  effect: "read-write"
  author: "Rik Dryfoos / Dryfoos Consulting"
  license: "MIT"
  homepage: "https://github.com/rdryfoos/clewseau"
  repository: "https://github.com/rdryfoos/clewseau"

requires:
  speckit_version: ">=0.14.0"
  tools: []

provides:
  commands:
    - name: "speckit.clewseau-gate.check"
      file: "commands/speckit.clewseau-gate.check.md"
      description: "Run Clewseau Gate 2 (silent gaps fail; write clew.json)"

  config:
    - name: "clewseau-gate-config.yml"
      template: "config-template.yml"
      description: "Registry path, source/test globs, and ID grammar"
      required: true

hooks:
  after_implement:
    command: "speckit.clewseau-gate.check"
    optional: true
    prompt: "Run Clewseau Gate 2 traceability check?"
    description: "Refuse silent gaps after implementation; refresh clew.json"

tags:
  - "traceability"
  - "gate"
  - "ci"
  - "governance"
  - "sdd"
